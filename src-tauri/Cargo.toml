[package]
name = "LicenseCalc_desktop"
version = "0.1.0"
description = "LicenseCalc License Catalog desktop shell"
authors = ["Your Name <you@example.com>"]
license = ""
repository = ""
default-run = "LicenseCalc_desktop"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "http-request", "dialog-confirm", "dialog-message", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
